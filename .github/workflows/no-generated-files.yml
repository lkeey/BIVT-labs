name: Reject generated files

on:
  push:
  pull_request:

jobs:
  no-generated-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject tracked generated files
        shell: bash
        run: |
          blocked="$(git ls-files | grep -E '(^|/)(\.DS_Store$|bin/|obj/)' || true)"
          if [[ -n "${blocked}" ]]; then
            printf 'Generated files are tracked:\n%s\n' "${blocked}" >&2
            exit 1
          fi
