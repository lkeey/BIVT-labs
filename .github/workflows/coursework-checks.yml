name: Coursework checks

on:
  push:
    paths:
      - "03SQL-CourseWork/**"
      - ".github/workflows/coursework-checks.yml"
  pull_request:
    paths:
      - "03SQL-CourseWork/**"
      - ".github/workflows/coursework-checks.yml"

jobs:
  go-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 03SQL-CourseWork/backend/go.mod
          cache-dependency-path: 03SQL-CourseWork/backend/go.sum
      - name: Verify module checksums
        working-directory: 03SQL-CourseWork/backend
        run: go mod verify
      - name: Build API
        working-directory: 03SQL-CourseWork/backend
        run: go build ./...
      - name: Vet API
        working-directory: 03SQL-CourseWork/backend
        run: go vet ./...

  contract-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install contract parser
        run: python -m pip install PyYAML==6.0.3
      - name: Check OpenAPI against Go routes
        run: python 03SQL-CourseWork/tools/verify_contract.py
      - name: Parse Python worker modules
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in sorted(Path('03SQL-CourseWork/worker').glob('*.py')):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              print(f'Parsed {path}')
          PY
      - name: Check browser JavaScript syntax
        run: |
          for file in 03SQL-CourseWork/web/public/*.js; do
            node --check "$file"
          done
