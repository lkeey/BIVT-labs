name: bivt-sql-coursework
# SQL Server is a separate prerequisite. No model or indexing service is needed.
services:
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADDR: ":8080"
      SQLSERVER_DSN: "${SQLSERVER_DSN:?Set SQLSERVER_DSN in .env}"
      FIREBASE_PROJECT_ID: "bivt-labs-sql-coursework"
      FIREBASE_WEB_API_KEY: "${FIREBASE_WEB_API_KEY:?Set Firebase Web API key in .env}"
      CORS_ORIGIN: "${CORS_ORIGIN:-https://bivt-labs-sql-coursework.web.app}"
