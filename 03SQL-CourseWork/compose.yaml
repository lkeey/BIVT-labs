name: bivt-sql-coursework

# Local application stack. SQL Server 2025 and the chat model are separate
# prerequisites; neither is replaced by a different database in this file.
services:
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADDR: ":8080"
      SQLSERVER_DSN: "${SQLSERVER_DSN:?Set SQLSERVER_DSN in .env}"
      FIREBASE_PROJECT_ID: "bivt-labs-sql-coursework"
      CORS_ORIGIN: "${CORS_ORIGIN:-https://bivt-labs-sql-coursework.web.app}"
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase-adc.json"
      EMBEDDING_SERVICE_URL: "http://172.30.251.10:8765/embed"
      EMBEDDING_SERVICE_TOKEN: "${COURSEWORK_EMBED_BEARER_TOKEN:?Set a random 32-character token in .env}"
      CHAT_COMPLETIONS_URL: "${CHAT_COMPLETIONS_URL:?Set the trusted chat endpoint in .env}"
      CHAT_MODEL: "${CHAT_MODEL:?Set the chat model in .env}"
      CHAT_API_KEY: "${CHAT_API_KEY:-}"
      CHAT_HEALTH_URL: "${CHAT_HEALTH_URL:-}"
    volumes:
      - "${FIREBASE_ADC_PATH:?Set the absolute ADC file path in .env}:/run/secrets/firebase-adc.json:ro"
    depends_on:
      embed:
        condition: service_healthy
    networks:
      app:

  embed:
    build: ./worker
    restart: unless-stopped
    command: ["python", "embed_service.py", "--host", "0.0.0.0"]
    environment:
      COURSEWORK_EMBED_BEARER_TOKEN: "${COURSEWORK_EMBED_BEARER_TOKEN:?Set a random 32-character token in .env}"
      HF_HOME: "/var/cache/coursework-hf"
    volumes:
      - hf-cache:/var/cache/coursework-hf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 4
      start_period: 180s
    networks:
      app:
        ipv4_address: 172.30.251.10

  index-worker:
    build: ./worker
    restart: unless-stopped
    command: ["python", "index_worker.py", "--loop", "--poll-seconds", "10"]
    environment:
      COURSEWORK_SQL_ODBC_CONNECTION_STRING: "${COURSEWORK_SQL_ODBC_CONNECTION_STRING:?Set the worker SQL connection string in .env}"
      HF_HOME: "/var/cache/coursework-hf"
    volumes:
      - hf-cache:/var/cache/coursework-hf
    networks:
      app:

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.251.0/24

volumes:
  hf-cache:
