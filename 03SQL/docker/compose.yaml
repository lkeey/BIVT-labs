name: sql-server-lab

x-sql-server-image: &sql-server-image "mcr.microsoft.com/mssql/server:2019-CU32-GDR10-ubuntu-20.04@sha256:46f719fd3457d4e7e8e5845fe00c35c20e7bae7ff1e8b9fe595f2a81029f5ba8"

services:
  sqlserver:
    image: *sql-server-image
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      SQLSERVER_HOST: localhost
      SQLSERVER_PORT: "1433"
      DATABASE_NAME: AdventureWorksLT2019
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./.cache/AdventureWorksLT2019.bak:/var/opt/mssql/backup/AdventureWorksLT2019.bak:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  db-init:
    image: *sql-server-image
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: "1433"
      DATABASE_NAME: AdventureWorksLT2019
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./.cache/AdventureWorksLT2019.bak:/var/opt/mssql/backup/AdventureWorksLT2019.bak:ro
      - ./scripts/restore-adventureworks.sh:/usr/local/bin/restore-adventureworks.sh:ro
    command: ["/bin/bash", "/usr/local/bin/restore-adventureworks.sh"]
    restart: "no"

volumes:
  sqlserver-data:
    name: sql-server-lab-data
